name: Train and Release Intent Models

on:
  workflow_dispatch:
    inputs:
      rel_version:
        description: 'Release version (e.g., 1.9.0-rc.1, 1.9.1)'
        required: true
        type: string

permissions:
  id-token: write
  contents: write

env:
  PYTHON_VERSION: "3.10"
  DOTNET_VERSION: "10.0.x"
  MODELS: "64 128 256 512"

jobs:
  train-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "VERSION=${{ github.event.inputs.rel_version }}" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/train-release.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers datasets scikit-learn pandas "optimum[onnxruntime]" accelerate

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: synentra

      - name: Checkout dataset repository
        uses: actions/checkout@v4
        with:
          repository: synentra/synentra-intent-data
          token: ${{ steps.app-token.outputs.token }}
          path: private-dataset

      # =========================
      # TRAIN ALL FOUR MODELS
      # =========================
      - name: Train community models (64, 128, 256, 512)
        shell: bash
        run: |
          mkdir -p release_artifacts
          VERSION="${{ steps.version.outputs.VERSION }}"

          for MAXLEN in $MODELS; do
            echo "Training community model with max_length=$MAXLEN (version $VERSION)"
            
            MODEL_DIR="community_model_$MAXLEN"
            ONNX_DIR="${MODEL_DIR}_onnx"
            ZIP_NAME="intent-model-community-${MAXLEN}.zip"

            python src/train_intent_classifier.py \
              --model_path distilbert-base-uncased \
              --data_path private-dataset/data/community/dataset.csv \
              --model_type community \
              --export_onnx \
              --max_length "$MAXLEN" \
              --version "$VERSION" \
              --output_dir "$MODEL_DIR" \
              --onnx_output_dir "$ONNX_DIR"

            # Build release folder
            mkdir -p release_temp
            cp "$ONNX_DIR/model.onnx" release_temp/
            cp "$MODEL_DIR/vocab.txt" release_temp/
            # copy metadata
            cp "$ONNX_DIR/metadata.json" release_temp/ 2>/dev/null || true

            # Generate labels.json from config (using an external script)
            python src/generate_labels_json.py "$ONNX_DIR"

            # Zip the release
            (cd release_temp && zip -r "../release_artifacts/$ZIP_NAME" .)

            # Cleanup
            rm -rf release_temp
            rm -rf "$MODEL_DIR" "$ONNX_DIR"
          done

      # =========================
      # GENERATE CHECKSUMS
      # =========================
      - name: Generate checksums
        run: |
          cd release_artifacts
          for file in *.zip; do
            sha256sum "$file" > "$file.sha256"
          done

      # =========================
      # GITHUB RELEASE
      # =========================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Intent Models CE ${{ steps.version.outputs.VERSION }}
          files: |
            release_artifacts/intent-model-community-*.zip
            release_artifacts/*.sha256