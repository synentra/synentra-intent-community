name: Train and Release Intent Model

on:
  workflow_dispatch:  # manual trigger

jobs:
  train-and-release:
    runs-on: ubuntu-latest
    # Declare outputs that you can use in later jobs if needed
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers datasets scikit-learn pandas "optimum[onnxruntime]"

      # ---------- Version handling ----------
      - name: Get version from file (or Git tag)
        id: get_version
        run: |
          if [[ -f VERSION ]]; then
            echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.1.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Print version
        run: echo "Building version ${{ steps.get_version.outputs.VERSION }}"
      # --------------------------------------

      - name: Generate training data
        run: python generate_training_data.py

      - name: Train model and export ONNX
        run: python train_intent_classifier.py

      - name: Create labels.json from model config
        run: |
          python -c "
          import json
          with open('./intent_model_onnx/config.json') as f:
              config = json.load(f)
          id2label = config['id2label']
          labels = [id2label[str(i)] for i in range(len(id2label))]
          with open('labels.json', 'w') as f:
              json.dump(labels, f)
          "

      - name: Copy vocab.txt
        run: cp ./intent_model/vocab.txt .

      # Write version file to include in the artifact
      - name: Add version file
        run: echo "${{ steps.get_version.outputs.VERSION }}" > version.txt

      - name: Package artifacts
        run: |
          mkdir -p release
          cp ./intent_model_onnx/model.onnx release/
          cp labels.json release/
          cp vocab.txt release/
          cp version.txt release/
          (cd release && zip -r ../intent_model-${{ steps.get_version.outputs.VERSION }}.zip .)

      # Upload the zip as a GitHub Actions artifact (available in run page)
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: intent-model-${{ steps.get_version.outputs.VERSION }}
          path: intent_model-${{ steps.get_version.outputs.VERSION }}.zip

      # Create a GitHub Release and attach the same zip
      - name: Create Release and Upload Artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Intent Model ${{ steps.get_version.outputs.VERSION }}
          body: |
            - ONNX intent classifier model
            - Labels mapping (labels.json)
            - Tokenizer vocabulary (vocab.txt)
            - Version: ${{ steps.get_version.outputs.VERSION }}
          files: intent_model-${{ steps.get_version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}