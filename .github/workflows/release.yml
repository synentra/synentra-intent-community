name: Train and Release Intent Model

on:
  workflow_dispatch:
    inputs:
      rel_version:
        description: 'Release version (e.g., 1.9.0-rc.1, 1.9.1)'
        required: true
        type: string

permissions:
  id-token: write
  contents: write

env:
  PYTHON_VERSION: "3.10"
  DOTNET_VERSION: "10.0.x"

jobs:
  train-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "VERSION=${{ github.event.inputs.rel_version }}" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Cache pip packages – keyed by the workflow file itself
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/train-release.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers datasets scikit-learn pandas "optimum[onnxruntime]" accelerate

      # =========================
      # COMMUNITY TRAINING
      # =========================
      - name: Train community model
        run: |
          python src/train_intent_classifier.py \
            --model_path distilbert-base-uncased \
            --data_path data/dataset.csv \
            --model_type community \
            --export_onnx \
            --output_dir community_model \
            --onnx_output_dir community_model_onnx

      - name: Build community artifacts
        shell: bash
        run: |
          mkdir -p community_release

          cp community_model_onnx/model.onnx community_release/
          cp community_model/vocab.txt community_release/

          python << 'PYEOF'
          import json
          with open('community_model_onnx/config.json') as f:
              config = json.load(f)
          labels = [config['id2label'][str(i)] for i in range(len(config['id2label']))]
          json.dump(labels, open('community_release/labels.json','w'))
          PYEOF

          echo "${{ steps.version.outputs.VERSION }}" > community_release/version.txt

          (cd community_release && zip -r ../intent-model-community.zip .)

      # =========================
      # CHECKSUMS
      # =========================
      - name: Generate checksums
        run: |
          sha256sum intent-model-community.zip > intent-model-community.zip.sha256

      # =========================
      # GITHUB RELEASE (COMMUNITY)
      # =========================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Intent Model Community ${{ steps.version.outputs.VERSION }}
          files: |
            intent-model-community.zip
            intent-model-community.zip.sha256