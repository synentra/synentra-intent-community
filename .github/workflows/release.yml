name: Train and Release Intent Models

on:
  workflow_dispatch:
    inputs:
      rel_version:
        description: "Release version (e.g., 1.9.0-rc.1, 1.9.1)"
        required: true
        type: string

permissions:
  id-token: write
  contents: write

env:
  PYTHON_VERSION: "3.10"

jobs:
  train:
    name: Train community model
    runs-on: [self-hosted, linux, x64, gpu]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/train-release.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip uninstall -y torch torchvision torchaudio

      - name: Install CUDA PyTorch
        run: |
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: synentra

      - name: Checkout dataset repository
        uses: actions/checkout@v4
        with:
          repository: synentra/synentra-intent-data
          token: ${{ steps.app-token.outputs.token }}
          path: private-dataset

      - name: Verify training GPU
        run: |
          echo "Python:"
          which python

          echo "CUDA_VISIBLE_DEVICES:"
          echo "${CUDA_VISIBLE_DEVICES:-<not set>}"

          nvidia-smi

          python - <<'PY'
          import torch
          import transformers
          import accelerate

          print("PyTorch:", torch.__version__)
          print("Transformers:", transformers.__version__)
          print("Accelerate:", accelerate.__version__)
          print("CUDA available:", torch.cuda.is_available())
          print("CUDA runtime:", torch.version.cuda)
          print("GPU count:", torch.cuda.device_count())

          if torch.cuda.is_available():
              print("GPU:", torch.cuda.get_device_name(0))

          assert torch.cuda.is_available(), "CUDA unavailable inside GitHub Actions"
          PY

      - name: Train model
        run: |
          MAXLEN=512
          VERSION="${{ github.event.inputs.rel_version }}"
          MODEL_DIR="community_model"
          ONNX_DIR="${MODEL_DIR}_onnx"
          ZIP_NAME="intent-model-community.zip"

          echo "Training community model with max_length=$MAXLEN (version $VERSION)"

          python src/train_intent_classifier.py \
            --model_path distilbert-base-uncased \
            --data_path private-dataset/data/community/dataset.csv \
            --model_type community \
            --export_onnx \
            --max_length "$MAXLEN" \
            --version "$VERSION" \
            --output_dir "$MODEL_DIR" \
            --onnx_output_dir "$ONNX_DIR"

          python src/generate_labels_json.py "$ONNX_DIR"

          mkdir -p release_temp
          cp "$ONNX_DIR/model.onnx" release_temp/
          cp "$MODEL_DIR/vocab.txt" release_temp/
          cp "$ONNX_DIR/metadata.json" release_temp/
          cp "$ONNX_DIR/labels.json" release_temp/

          mkdir -p release_artifacts
          (cd release_temp && zip -r "../release_artifacts/$ZIP_NAME" .)

          rm -rf release_temp "$MODEL_DIR" "$ONNX_DIR"

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-community
          path: release_artifacts/intent-model-community.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: train

    steps:
      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model-community
          path: release_artifacts

      - name: Generate checksum
        run: |
          cd release_artifacts
          sha256sum intent-model-community.zip > intent-model-community.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.rel_version }}
          name: Intent Models CE ${{ github.event.inputs.rel_version }}
          files: |
            release_artifacts/intent-model-community.zip
            release_artifacts/intent-model-community.zip.sha256