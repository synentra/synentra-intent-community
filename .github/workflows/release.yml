# .github/workflows/train_and_release.yml
name: Train and Release Intent Model

on:
  workflow_dispatch:
    inputs:
      rel_version:
        description: 'Release version (e.g., 1.9.0-rc.1, 1.9.1)'
        required: true
        type: string

jobs:
  train-and-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version from input
        id: version
        run: echo "VERSION=${{ github.event.inputs.rel_version }}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers datasets scikit-learn pandas "optimum[onnxruntime]" accelerate

      - name: Generate training data
        run: python src/generate_training_data.py

      - name: Train model and export ONNX
        run: python src/train_intent_classifier.py

      - name: Create labels.json from model config
        run: |
          python -c "
          import json
          with open('./intent_model_onnx/config.json') as f:
              config = json.load(f)
          id2label = config['id2label']
          labels = [id2label[str(i)] for i in range(len(id2label))]
          with open('labels.json', 'w') as f:
              json.dump(labels, f)
          "

      - name: Copy vocab.txt
        run: cp ./intent_model/vocab.txt .

      - name: Add version file
        run: echo "${{ steps.version.outputs.VERSION }}" > version.txt

      - name: Package artifacts
        run: |
          mkdir -p release
          cp ./intent_model_onnx/model.onnx release/
          cp labels.json release/
          cp vocab.txt release/
          cp version.txt release/
          ZIP_NAME="intent_model-${{ steps.version.outputs.VERSION }}.zip"
          (cd release && zip -r ../$ZIP_NAME .)
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Generate SHA256 checksum
        run: |
          sha256sum ${{ env.ZIP_NAME }} > ${{ env.ZIP_NAME }}.sha256
          cat ${{ env.ZIP_NAME }}.sha256

      # Upload the zip and checksum as workflow artifacts
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: intent_model-${{ steps.version.outputs.VERSION }}
          path: ${{ env.ZIP_NAME }}

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: intent_model-${{ steps.version.outputs.VERSION }}-sha256
          path: ${{ env.ZIP_NAME }}.sha256

      # Create GitHub Release and attach both files
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Intent Model ${{ steps.version.outputs.VERSION }}
          body: |
            - ONNX intent classifier model
            - Labels mapping (labels.json)
            - Tokenizer vocabulary (vocab.txt)
            - Version: ${{ steps.version.outputs.VERSION }}
            - SHA256 checksum: see attached .sha256 file
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}