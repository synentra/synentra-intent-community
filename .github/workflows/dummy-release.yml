name: Train and Release Intent Model (TEST – dummy ONNX)

on:
  workflow_dispatch:
    inputs:
      rel_version:
        description: 'Release version (e.g., 1.9.0-rc.1, 1.9.1)'
        required: true
        type: string

permissions:
  id-token: write
  contents: write

env:
  PYTHON_VERSION: "3.10"
  DOTNET_VERSION: "10.0.x"

jobs:
  train-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "VERSION=${{ github.event.inputs.rel_version }}" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/train-release.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers datasets scikit-learn pandas "optimum[onnxruntime]" accelerate

      # ======================================================
      # DUMMY MODEL GENERATION (no torch.onnx, no onnxscript)
      # ======================================================
      - name: Generate dummy ONNX models and support files
        run: |
          mkdir -p community_model_onnx pro_model_onnx
          mkdir -p community_model pro_model

          echo -e "[PAD]\n[UNK]\n[CLS]\n[SEP]\nhello\nworld" > community_model/vocab.txt
          cp community_model/vocab.txt pro_model/vocab.txt

          cat > community_model_onnx/config.json << EOF
          {
            "id2label": {"0": "greeting", "1": "goodbye"},
            "label2id": {"greeting": 0, "goodbye": 1}
          }
          EOF
          cp community_model_onnx/config.json pro_model_onnx/config.json

          head -c 1024 /dev/urandom > community_model_onnx/model.onnx
          cp community_model_onnx/model.onnx pro_model_onnx/model.onnx

          echo "Dummy model files created (model.onnx is random binary)"

      - name: Build community artifacts
        shell: bash
        run: |
          mkdir -p community_release
          cp community_model_onnx/model.onnx community_release/
          cp community_model/vocab.txt community_release/
          python << 'PYEOF'
          import json
          with open('community_model_onnx/config.json') as f:
              config = json.load(f)
          labels = [config['id2label'][str(i)] for i in range(len(config['id2label']))]
          json.dump(labels, open('community_release/labels.json','w'))
          PYEOF
          echo "${{ steps.version.outputs.VERSION }}" > community_release/version.txt
          (cd community_release && zip -r ../community-model.zip .)

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Encryptor
        run: dotnet build tools/Encryptor.csproj -c Release

      - name: Encrypt pro ONNX
        run: |
          dotnet run --project tools/Encryptor.csproj -- \
            "${{ github.workspace }}/pro_model_onnx/model.onnx" \
            "${{ github.workspace }}/pro_model_onnx/model.onnx.enc" \
            "${{ secrets.MODEL_SECRET }}"

      - name: Build pro package
        shell: bash
        run: |
          mkdir -p pro_release
          cp pro_model_onnx/model.onnx.enc pro_release/
          cp pro_model/vocab.txt pro_release/
          python << 'PYEOF'
          import json
          with open('pro_model_onnx/config.json') as f:
              config = json.load(f)
          labels = [config['id2label'][str(i)] for i in range(len(config['id2label']))]
          json.dump(labels, open('pro_release/labels.json','w'))
          PYEOF
          echo "${{ steps.version.outputs.VERSION }}" > pro_release/version.txt
          (cd pro_release && zip -r ../pro-model.enc.zip .)

      - name: Generate checksums
        run: |
          sha256sum community-model.zip > community-model.zip.sha256
          sha256sum pro-model.enc.zip > pro-model.enc.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Intent Model ${{ steps.version.outputs.VERSION }}
          files: |
            community-model.zip
            community-model.zip.sha256

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure context
        run: az account show

      - name: Upload Pro Model to Azure (OIDC)
        run: |
          az storage blob upload \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --container-name ${{ secrets.AZURE_STORAGE_CONTAINER }} \
            --name "pro/${{ steps.version.outputs.VERSION }}/pro-model.enc.zip" \
            --file "pro-model.enc.zip" \
            --overwrite true \
            --auth-mode login

          az storage blob upload \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --container-name ${{ secrets.AZURE_STORAGE_CONTAINER }} \
            --name "pro/${{ steps.version.outputs.VERSION }}/pro-model.enc.zip.sha256" \
            --file "pro-model.enc.zip.sha256" \
            --overwrite true \
            --auth-mode login